name: Conformidad

# Corre la suite del repositorio en cada push y en cada pull request. Comprueba el contrato de
# lectura de los filtros contra fixtures adversariales y la coherencia del router con lo que el
# repositorio contiene de verdad.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Suite de conformidad
        run: node scripts/validate-router.mjs
